name: NDK build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: ['version-*']
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Run existing tests
        run: ./test.sh

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
        with:
          publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'late' || '' }}
          publish_token: ${{ secrets.QPM_TOKEN }}
      - name: Build package
        run: qpm2 qpkg --qmod
      - name: Name debug artifact
        run: cp build/debug/libflamingo.so build/debug_libflamingo.so
      - uses: actions/upload-artifact@v4
        with:
          name: flamingo
          path: |
            build/libflamingo.so
            build/debug_libflamingo.so
            flamingo.qmod
            flamingo.qpkg
          if-no-files-found: error
      - name: Upload debug release artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: ${{ github.ref_name }}
          files: build/debug_libflamingo.so
